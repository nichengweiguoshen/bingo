<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Execution System</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script>
        (() => {
            const savedTheme = localStorage.getItem('executionSystemTheme') || 'system';
            document.documentElement.dataset.theme = savedTheme;
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            color-scheme: light;
            --page-bg: #f3f4f6;
            --app-bg: #ffffff;
            --panel-bg: #ffffff;
            --panel-soft: #f9fafb;
            --panel-muted: #f3f4f6;
            --text-main: #111827;
            --text-body: #374151;
            --text-muted: #6b7280;
            --text-soft: #9ca3af;
            --border-soft: #f1f5f9;
            --border-main: #e5e7eb;
            --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --input-bg: #f9fafb;
            --primary-soft: #eff6ff;
            --primary: #2563eb;
            --primary-border: #bfdbfe;
            --danger: #ef4444;
            --success: #22c55e;
            --gold-soft: #fefce8;
            --gold: #eab308;
            --gold-text: #a16207;
            --bg-empty: #ebedf0; --bg-l1: #9be9a8; --bg-l2: #40c463; --bg-l3: #30a14e; --bg-l4: #216e39;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --page-bg: #050814;
                --app-bg: #0f172a;
                --panel-bg: #111827;
                --panel-soft: #172033;
                --panel-muted: #1f2937;
                --text-main: #f8fafc;
                --text-body: #d1d5db;
                --text-muted: #94a3b8;
                --text-soft: #64748b;
                --border-soft: #1f2937;
                --border-main: #334155;
                --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.35);
                --overlay-bg: rgba(2, 6, 23, 0.72);
                --input-bg: #0f172a;
                --primary-soft: rgba(59, 130, 246, 0.15);
                --primary: #60a5fa;
                --primary-border: rgba(96, 165, 250, 0.32);
                --danger: #fb7185;
                --success: #4ade80;
                --gold-soft: rgba(234, 179, 8, 0.16);
                --gold: #facc15;
                --gold-text: #fde68a;
                --bg-empty: #1e293b; --bg-l1: #14532d; --bg-l2: #166534; --bg-l3: #15803d; --bg-l4: #22c55e;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --page-bg: #050814;
            --app-bg: #0f172a;
            --panel-bg: #111827;
            --panel-soft: #172033;
            --panel-muted: #1f2937;
            --text-main: #f8fafc;
            --text-body: #d1d5db;
            --text-muted: #94a3b8;
            --text-soft: #64748b;
            --border-soft: #1f2937;
            --border-main: #334155;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.35);
            --overlay-bg: rgba(2, 6, 23, 0.72);
            --input-bg: #0f172a;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --primary: #60a5fa;
            --primary-border: rgba(96, 165, 250, 0.32);
            --danger: #fb7185;
            --success: #4ade80;
            --gold-soft: rgba(234, 179, 8, 0.16);
            --gold: #facc15;
            --gold-text: #fde68a;
            --bg-empty: #1e293b; --bg-l1: #14532d; --bg-l2: #166534; --bg-l3: #15803d; --bg-l4: #22c55e;
        }

        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--page-bg); -webkit-tap-highlight-color: transparent; color: var(--text-main); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: var(--app-bg); min-height: 100vh; display: flex; flex-direction: column; box-shadow: var(--shadow-soft); position: relative; padding-bottom: 70px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Bingo 专属样式 --- */
        .bingo-grid { display: grid; gap: 6px; padding: 0 16px; transition: all 0.3s ease; border-radius: 18px; }
        .bingo-grid.bingo-glow { animation: bingoGoldenGlow 1200ms ease-out; }
        .grid-item { aspect-ratio: 1 / 1; background-color: var(--panel-soft); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: var(--text-body); cursor: pointer; user-select: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid var(--border-main); text-align: center; padding: 4px; line-height: 1.2; overflow: hidden; word-break: break-all; }
        .grid-item.active { background-color: var(--gold-soft); border-color: var(--gold); color: var(--gold-text); font-weight: 600; transform: scale(0.92); box-shadow: inset 0 0 10px rgba(234, 179, 8, 0.14); }
        .grid-item.just-completed::after { content: ""; position: absolute; inset: -35%; background: radial-gradient(circle, rgba(255,255,255,0.88) 0%, rgba(250,204,21,0.42) 36%, rgba(250,204,21,0) 68%); animation: cellFlash 520ms ease-out; pointer-events: none; }
        .grid-item.bingo-line { background: linear-gradient(135deg, var(--gold-soft), rgba(250, 204, 21, 0.28)); border-color: var(--gold); color: var(--gold-text); box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.22), 0 10px 22px rgba(234, 179, 8, 0.22); transform: scale(0.96); }
        .grid-item.bingo-line::before { content: ""; position: absolute; inset: 8%; border-radius: 8px; border: 1px solid rgba(234, 179, 8, 0.58); pointer-events: none; }
        .intent-input { width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-main); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.35; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .intent-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        .progress-ring__circle { transition: stroke-dashoffset 0.4s ease-in-out, stroke 0.3s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
        
        /* --- Bingo 日历专属样式 --- */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-day-header { font-size: 0.7rem; text-align: center; color: var(--text-muted); font-weight: 600; padding-bottom: 4px; }
        .cal-cell { aspect-ratio: 1 / 1; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.75rem; font-weight: 600; position: relative; }
        .cal-empty { background-color: transparent; }
        .cal-no-data { background-color: var(--panel-muted); color: var(--text-soft); }
        .cal-partial { background-color: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary-border); }
        .cal-bingo { background-color: var(--gold-soft); color: var(--gold-text); border: 2px solid var(--gold); box-shadow: 0 2px 10px rgba(250, 204, 21, 0.16); }
        .cal-today-indicator { position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background-color: #ef4444; }
        .mood-dot-start { position: absolute; top: 3px; left: 3px; width: 5px; height: 5px; border-radius: 50%; }
        .mood-dot-end { position: absolute; bottom: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; }

        /* --- 纪律系统专属样式 --- */
        .task-card { transition: all 0.2s ease; border: 1px solid var(--border-soft); }
        .task-card:active { transform: scale(0.98); }
        .checkbox-custom { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--border-main); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .checkbox-custom.checked { background-color: var(--success); border-color: var(--success); color: #ffffff; }
        .checkbox-custom.just-checked { animation: checkboxCompleteScale 360ms cubic-bezier(0.2, 0.85, 0.25, 1.35); }
        .heatmap-container { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 10px; }
        .heatmap-cell { width: 11px; height: 11px; border-radius: 2px; background-color: var(--bg-empty); }
        .level-1 { background-color: var(--bg-l1); } .level-2 { background-color: var(--bg-l2); } .level-3 { background-color: var(--bg-l3); } .level-4 { background-color: var(--bg-l4); }

        /* --- 通用辅助样式 --- */
        button, .grid-item, .task-card { position: relative; overflow: hidden; }
        .btn-press:active { transform: scale(0.95); }
        .micro-bounce { animation: microBounce 260ms cubic-bezier(0.2, 0.8, 0.2, 1); }
        .ripple-wave { position: absolute; border-radius: 999px; pointer-events: none; transform: translate(-50%, -50%) scale(0); background: rgba(255, 255, 255, 0.48); animation: rippleWave 520ms ease-out; z-index: 1; }
        .grid-item .ripple-wave { background: rgba(234, 179, 8, 0.22); }
        .task-card .ripple-wave { background: rgba(59, 130, 246, 0.12); }
        .haptic-fallback { animation: hapticFallbackPulse 120ms ease-out; }
        @keyframes microBounce {
            0% { transform: scale(1); }
            45% { transform: scale(0.97); }
            75% { transform: scale(1.018); }
            100% { transform: scale(1); }
        }
        @keyframes rippleWave {
            to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
        @keyframes bingoGoldenGlow {
            0% { box-shadow: 0 0 0 rgba(234, 179, 8, 0); }
            35% { box-shadow: 0 0 0 6px rgba(250, 204, 21, 0.24), 0 0 36px rgba(234, 179, 8, 0.42); }
            100% { box-shadow: 0 0 0 rgba(234, 179, 8, 0); }
        }
        @keyframes cellFlash {
            0% { opacity: 0; transform: scale(0.2); }
            35% { opacity: 1; transform: scale(0.85); }
            100% { opacity: 0; transform: scale(1.45); }
        }
        @keyframes checkboxCompleteScale {
            0% { transform: scale(0.82); }
            55% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        @keyframes hapticFallbackPulse {
            0% { filter: brightness(1); }
            50% { filter: brightness(0.94); }
            100% { filter: brightness(1); }
        }
        .toast-notification { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background-color: rgba(31, 41, 55, 0.9); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 100; white-space: nowrap; }
        .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 4px; }
        .theme-toggle-icon { transition: transform 0.2s ease; }
        :root[data-theme="light"] .theme-icon-system,
        :root[data-theme="light"] .theme-icon-dark,
        :root[data-theme="dark"] .theme-icon-system,
        :root[data-theme="dark"] .theme-icon-light,
        :root[data-theme="system"] .theme-icon-light,
        :root[data-theme="system"] .theme-icon-dark { display: none; }
        :root[data-theme="light"] .theme-icon-light,
        :root[data-theme="dark"] .theme-icon-dark,
        :root[data-theme="system"] .theme-icon-system { display: inline-block; }
        .bg-white, .bg-gray-50, .bg-slate-50 { background-color: var(--panel-bg) !important; }
        .bg-gray-100, .bg-gray-200, .bg-slate-100, .bg-blue-50, .bg-emerald-50 { background-color: var(--panel-muted) !important; }
        .hover\:bg-gray-200:hover, .hover\:bg-gray-300:hover, .hover\:bg-slate-50:hover { background-color: var(--panel-muted) !important; }
        .hover\:bg-blue-600:hover { background-color: var(--primary) !important; filter: brightness(0.94); }
        .bg-slate-900, .bg-gray-900 { background-color: var(--text-main) !important; color: var(--app-bg) !important; }
        .bg-blue-500 { background-color: var(--primary) !important; }
        .text-gray-900, .text-gray-800, .text-slate-900, .text-slate-800 { color: var(--text-main) !important; }
        .text-gray-700, .text-slate-700, .text-slate-600, .text-gray-600 { color: var(--text-body) !important; }
        .text-gray-500, .text-slate-500, .text-gray-400, .text-slate-400, .text-gray-300, .text-slate-300 { color: var(--text-muted) !important; }
        .text-blue-600, .text-blue-500 { color: var(--primary) !important; }
        .text-yellow-600 { color: var(--gold-text) !important; }
        .text-emerald-600 { color: var(--success) !important; }
        .text-red-500, .hover\:text-red-500:hover, .hover\:text-red-400:hover { color: var(--danger) !important; }
        .border-gray-100, .border-slate-100, .border-slate-50 { border-color: var(--border-soft) !important; }
        .border-gray-200, .border-slate-200, .border-blue-100, .border-emerald-100 { border-color: var(--border-main) !important; }
        .border-blue-100 { border-color: var(--primary-border) !important; }
        input, textarea { color: var(--text-body) !important; caret-color: var(--primary); }
        input::placeholder, textarea::placeholder { color: var(--text-soft) !important; }
        .shadow-sm, .shadow-md, .shadow-xl { box-shadow: var(--shadow-soft) !important; }
        
        /* 模态框 */
        .modal-overlay { background-color: var(--overlay-bg); backdrop-filter: blur(2px); opacity: 0; visibility: hidden; transition: all 0.2s ease; z-index: 50;}
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content { transform: translateY(20px) scale(0.95); opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal-overlay.show .modal-content { transform: translateY(0) scale(1); opacity: 1; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="view-bingo" class="flex-1 flex flex-col w-full h-full">
            <header class="pt-8 pb-4 px-6 flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Daily Bingo</h1>
                    <p id="bingoDateDisplay" class="text-xs text-gray-500 font-medium uppercase mt-1"></p>
                </div>
                <div class="flex space-x-2">
                    <button onclick="cycleThemeMode()" class="theme-toggle btn-press w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200" aria-label="切换主题">
                        <i class="theme-toggle-icon theme-icon-system fas fa-circle-half-stroke"></i>
                        <i class="theme-toggle-icon theme-icon-light fas fa-sun"></i>
                        <i class="theme-toggle-icon theme-icon-dark fas fa-moon"></i>
                    </button>
                    <button onclick="openBingoHistory()" class="btn-press w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200">
                        <i class="fas fa-calendar-check"></i>
                    </button>
                    <button onclick="openBingoSettings()" class="btn-press w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                </div>
            </header>

            <section class="px-6 mb-4 flex items-center bg-white rounded-2xl mx-4 p-4 shadow-sm border border-gray-100">
                <div class="relative w-14 h-14 flex-shrink-0 flex justify-center items-center mr-4">
                    <svg class="w-full h-full absolute top-0 left-0" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" fill="transparent" stroke="var(--panel-muted)" stroke-width="8"></circle>
                        <circle id="progressRing" class="progress-ring__circle" cx="50" cy="50" r="42" fill="transparent" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="263.89"></circle>
                    </svg>
                    <span id="progressText" class="absolute text-xs font-bold text-gray-800">0%</span>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h2 class="text-base font-bold text-gray-900" id="progressStatusText">进行中</h2>
                        <span id="gridSizeBadge" class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">4x4</span>
                    </div>
                    <p class="text-[11px] text-gray-500 mt-1">连成任意直线或对角线即达成。</p>
                </div>
            </section>

            <section class="px-6 mb-5 flex space-x-3">
                <button onclick="cycleMood('start')" class="flex-1 bg-white rounded-xl p-3 shadow-sm border border-gray-100 flex items-center justify-between transition btn-press">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-sun text-gray-400 text-sm"></i>
                        <span class="text-xs font-bold text-gray-600">晨间状态</span>
                    </div>
                    <span id="moodStartIcon" class="text-lg text-gray-300"><i class="fas fa-minus-circle"></i></span>
                </button>
                <button onclick="cycleMood('end')" class="flex-1 bg-white rounded-xl p-3 shadow-sm border border-gray-100 flex items-center justify-between transition btn-press">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-moon text-gray-400 text-sm"></i>
                        <span class="text-xs font-bold text-gray-600">晚间复盘</span>
                    </div>
                    <span id="moodEndIcon" class="text-lg text-gray-300"><i class="fas fa-minus-circle"></i></span>
                </button>
            </section>

            <section class="px-6 mb-5">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3 class="text-sm font-bold text-gray-900">今日意图</h3>
                            <p class="text-[10px] text-gray-500 mt-0.5">1 个主线，3 个轻任务，晚间复盘。</p>
                        </div>
                        <i class="fas fa-bullseye text-blue-500"></i>
                    </div>
                    <div class="space-y-2">
                        <input id="intentMainTask" class="intent-input" type="text" placeholder="今日主线任务" oninput="updateTodayIntent('mainTask', this.value)">
                        <div class="grid grid-cols-3 gap-2">
                            <input id="intentLightTask0" class="intent-input" type="text" placeholder="轻任务 1" oninput="updateTodayIntent('lightTask0', this.value)">
                            <input id="intentLightTask1" class="intent-input" type="text" placeholder="轻任务 2" oninput="updateTodayIntent('lightTask1', this.value)">
                            <input id="intentLightTask2" class="intent-input" type="text" placeholder="轻任务 3" oninput="updateTodayIntent('lightTask2', this.value)">
                        </div>
                        <div class="grid grid-cols-1 gap-2 pt-1">
                            <input id="intentDoneReason" class="intent-input" type="text" placeholder="完成原因" oninput="updateTodayIntent('doneReason', this.value)">
                            <input id="intentUndoneReason" class="intent-input" type="text" placeholder="未完成原因" oninput="updateTodayIntent('undoneReason', this.value)">
                            <input id="intentMoodChange" class="intent-input" type="text" placeholder="情绪变化" oninput="updateTodayIntent('moodChange', this.value)">
                        </div>
                    </div>
                </div>
            </section>

            <section class="bingo-grid flex-1" id="gridContainer"></section>
            
            <section class="px-6 py-6 mt-auto border-t border-gray-100 bg-white">
                <div class="flex space-x-3">
                    <button onclick="shuffleGrid()" class="btn-press flex-1 bg-blue-50 text-blue-600 py-3 rounded-xl font-semibold text-sm flex justify-center items-center space-x-2 border border-blue-100">
                        <i class="fas fa-random"></i><span>重新生成</span>
                    </button>
                    <button onclick="resetBingoGrid()" class="btn-press flex-1 bg-gray-50 text-gray-600 py-3 rounded-xl font-semibold text-sm flex justify-center items-center space-x-2 border border-gray-200">
                        <i class="fas fa-undo"></i><span>清空状态</span>
                    </button>
                </div>
            </section>
        </div>

        <div id="view-discipline" class="flex-1 flex flex-col w-full h-full hidden bg-slate-50">
            <header class="pt-8 pb-4 px-6 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-slate-900">SYSTEM CORE</h1>
                    <p id="discDateDisplay" class="mono text-[10px] text-slate-400 mt-1 uppercase tracking-widest"></p>
                </div>
                <div class="flex space-x-2">
                    <button onclick="cycleThemeMode()" class="theme-toggle w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-400 btn-press" aria-label="切换主题">
                        <i class="theme-toggle-icon theme-icon-system fas fa-circle-half-stroke"></i>
                        <i class="theme-toggle-icon theme-icon-light fas fa-sun"></i>
                        <i class="theme-toggle-icon theme-icon-dark fas fa-moon"></i>
                    </button>
                    <button onclick="openDiscSettings()" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-400 btn-press">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </header>

            <section class="px-6 mb-6">
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Execution Heatmap</span>
                    <span id="streakCount" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full uppercase border border-emerald-100">0 Streaks</span>
                </div>
                <div class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm">
                    <div id="heatmapGrid" class="heatmap-container no-scrollbar"></div>
                    <div class="flex justify-between items-center mt-2 px-1">
                        <span class="text-[9px] text-slate-300 mono">12 Weeks</span>
                        <div class="flex items-center space-x-1">
                            <span class="text-[9px] text-slate-300 mr-1">Less</span>
                            <div class="heatmap-cell"></div><div class="heatmap-cell level-1"></div><div class="heatmap-cell level-2"></div><div class="heatmap-cell level-3"></div><div class="heatmap-cell level-4"></div>
                            <span class="text-[9px] text-slate-300 ml-1">More</span>

                <div class="p-4 border-t border-gray-100 bg-white">
                    <button onclick="closeDiscSettings()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm btn-press">保存并重启系统</button>
                </div>

        <div id="toast" class="toast-notification"></div>
    </div>

    <script>
        // ==================== 全局通用 ====================
        const getTodayDateStr = () => new Date().toLocaleDateString('zh-CN', {timeZone: 'Asia/Shanghai'}).replace(/\//g, '-');
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        const THEME_KEY = 'executionSystemTheme';
        const THEME_MODES = ['system', 'light', 'dark'];
        const systemDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');
        function getSavedThemeMode() {
            const saved = localStorage.getItem(THEME_KEY);
            return THEME_MODES.includes(saved) ? saved : 'system';
        }
        function getEffectiveTheme(mode = getSavedThemeMode()) {
            return mode === 'system' ? (systemDarkQuery.matches ? 'dark' : 'light') : mode;
        }
        function applyThemeMode(mode = getSavedThemeMode(), persist = false) {
            document.documentElement.dataset.theme = mode;
            if (persist) localStorage.setItem(THEME_KEY, mode);
            const effectiveTheme = getEffectiveTheme(mode);
            const themeColor = effectiveTheme === 'dark' ? '#0f172a' : '#ffffff';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor);
            document.querySelectorAll('.theme-toggle').forEach(btn => {
                btn.setAttribute('title', mode === 'system' ? '跟随系统' : mode === 'dark' ? '深色模式' : '浅色模式');
            });
            if (typeof updateBingoProgress === 'function') updateBingoProgress();
        }
        function cycleThemeMode() {
            const current = getSavedThemeMode();
            const next = THEME_MODES[(THEME_MODES.indexOf(current) + 1) % THEME_MODES.length];
            applyThemeMode(next, true);
            HAPTIC.play(HAPTIC.tap);
            showToast(next === 'system' ? '跟随系统主题' : next === 'dark' ? '已切换深色模式' : '已切换浅色模式');
        }
        systemDarkQuery.addEventListener('change', () => {
            if (getSavedThemeMode() === 'system') applyThemeMode('system');
        });
        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
        const HAPTIC = {
            tap: 12,
            success: [25, 30, 45],
            warning: [50, 40, 50],
            complete: [35, 25, 70],
            bingo: [80, 40, 120, 40, 180],
            delete: [70, 35, 35],
            reset: [35, 30, 35, 30, 70],
            streak: [30, 35, 30, 35, 120],
            _lastSource: null,
            play(preset = this.tap, sourceEl = this._lastSource) {
                const pattern = Array.isArray(preset) ? preset : [preset];
                if (navigator.vibrate) {
                    navigator.vibrate(0);
                    if (navigator.vibrate(pattern)) return true;
                }
                this.fallback(sourceEl);
                return false;
            },
            fallback(sourceEl) {
                const target = sourceEl || document.activeElement;
                if (!target || !target.classList) return;
                target.classList.remove('haptic-fallback');
                void target.offsetWidth;
                target.classList.add('haptic-fallback');
                setTimeout(() => target.classList.remove('haptic-fallback'), 140);
            }
        };
        window.HAPTIC = HAPTIC;
        function vibrate(p) { HAPTIC.play(p); }
        function setupButtonHaptics() {
            document.addEventListener('click', event => {
                const target = event.target.closest('button, .grid-item, .task-card');
                if (!target || target.dataset.haptic === 'off') return;
                HAPTIC._lastSource = target;
                playPressAnimation(target, event);
                const preset = target.dataset.haptic && HAPTIC[target.dataset.haptic] ? HAPTIC[target.dataset.haptic] : HAPTIC.tap;
                HAPTIC.play(preset, target);
            }, true);
        }
        function playPressAnimation(target, event) {
            target.classList.remove('micro-bounce');
            void target.offsetWidth;
            target.classList.add('micro-bounce');
            setTimeout(() => target.classList.remove('micro-bounce'), 280);

            const rect = target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple-wave';
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            ripple.style.left = `${event.clientX - rect.left}px`;
            ripple.style.top = `${event.clientY - rect.top}px`;
            target.appendChild(ripple);
            setTimeout(() => ripple.remove(), 540);
        }

        function switchTab(tab) {
            HAPTIC.play(HAPTIC.tap);
            const viewBingo = document.getElementById('view-bingo');
            const viewDisc = document.getElementById('view-discipline');
            const navBingo = document.getElementById('nav-bingo');
            const navDisc = document.getElementById('nav-discipline');

            if (tab === 'bingo') {
                viewBingo.classList.remove('hidden'); viewDisc.classList.add('hidden');
                navBingo.className = "flex-1 py-4 flex flex-col items-center text-blue-600 transition";
                navDisc.className = "flex-1 py-4 flex flex-col items-center text-gray-400 transition hover:text-gray-600";
            } else {
                viewBingo.classList.add('hidden'); viewDisc.classList.remove('hidden');
                navBingo.className = "flex-1 py-4 flex flex-col items-center text-gray-400 transition hover:text-gray-600";
                navDisc.className = "flex-1 py-4 flex flex-col items-center text-slate-800 transition";
            }
        }

        function exportData() {
            const exportObj = { bingo: bingoState, discipline: discState };
            const blob = new Blob([JSON.stringify(exportObj)], { type: "application/json" });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `System_Backup_${getTodayDateStr()}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); showToast("已导出全系统数据");
        }
        function importData(e) {
            const file = e.target.files[0]; if (!file) return;
            const r = new FileReader();
            r.onload = ev => { 
                try { 
                    const data = JSON.parse(ev.target.result); 
                    if(data.bingo) { bingoState = { ...bingoState, ...data.bingo }; saveBingo(); }
                    else { bingoState = { ...bingoState, ...data }; saveBingo(); }
                    if(data.discipline) { discState = { ...discState, ...data.discipline }; saveDisc(); }
                    window.location.reload(); 
                } catch (err) { showToast("解析失败"); } 
            };
            r.readAsText(file); e.target.value = '';
        }

        // ==================== BINGO 系统 ====================
        const BINGO_KEY = 'dailyBingoData_pwa';
        const DEFAULT_BINGO_TASKS = ["写今日意图", "选择今日主线", "推进主线任务", "完成轻任务 1", "完成轻任务 2", "完成轻任务 3", "记录完成原因", "记录未完成原因", "记录情绪变化", "早睡", "阅读", "看盘复盘", "整理房间", "冥想", "喝水", "拉伸", "断舍离", "看纪录片"];
        const MOODS = [{ val: null, icon: '<i class="fas fa-minus-circle"></i>', color: 'text-gray-300', dot: '' }, { val: 'good', icon: '<i class="fas fa-smile"></i>', color: 'text-green-500', dot: 'bg-green-500' }, { val: 'normal', icon: '<i class="fas fa-meh"></i>', color: 'text-yellow-500', dot: 'bg-yellow-500' }, { val: 'bad', icon: '<i class="fas fa-frown"></i>', color: 'text-red-500', dot: 'bg-red-500' }];
        function createEmptyTodayIntent() {
            return { mainTask: '', lightTasks: ['', '', ''], doneReason: '', undoneReason: '', moodChange: '' };
        }
        let bingoState = { gridSize: 4, taskLibrary: [...DEFAULT_BINGO_TASKS], currentTasks: [], currentStates: [], hasBingo: false, bingoLines: [], lastCompletedIndex: null, lastDate: '', todayMood: { start: null, end: null }, todayIntent: createEmptyTodayIntent(), history: {} };
        let tempGridSize = 4;

        function initBingo() {
            const saved = localStorage.getItem(BINGO_KEY); if (saved) bingoState = { ...bingoState, ...JSON.parse(saved) };
            if (!bingoState.todayMood) bingoState.todayMood = { start: null, end: null }; if (!bingoState.history) bingoState.history = {};
            if (!bingoState.todayIntent) bingoState.todayIntent = createEmptyTodayIntent();
            if (!Array.isArray(bingoState.todayIntent.lightTasks)) bingoState.todayIntent.lightTasks = ['', '', ''];
            if (!Array.isArray(bingoState.bingoLines)) bingoState.bingoLines = [];
            bingoState.lastCompletedIndex = null;
            let migratedTaskLibrary = false;
            DEFAULT_BINGO_TASKS.forEach(task => {
                if (!bingoState.taskLibrary.includes(task)) {
                    bingoState.taskLibrary.push(task);
                    migratedTaskLibrary = true;
                }
            });
            document.getElementById('bingoDateDisplay').innerText = new Date().toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit', weekday: 'short' }).replace(/\//g, '·');
            document.getElementById('gridSizeBadge').innerText = `${bingoState.gridSize}x${bingoState.gridSize}`;
            if (bingoState.lastDate !== getTodayDateStr()) generateBingoGrid();
            else { if (migratedTaskLibrary) saveBingo(); renderBingoGrid(); updateBingoProgress(); updateMoodUI(); updateTodayIntentUI(); }
        }
        function saveBingo() { localStorage.setItem(BINGO_KEY, JSON.stringify(bingoState)); }
        function generateBingoGrid() {
            let total = bingoState.gridSize ** 2; let pool = [...bingoState.taskLibrary].sort(() => Math.random() - 0.5);
            while (pool.length < total) pool.push("附加任务");
            bingoState.currentTasks = pool.slice(0, total); bingoState.currentStates = new Array(total).fill(false);
            bingoState.hasBingo = false; bingoState.bingoLines = []; bingoState.lastCompletedIndex = null; bingoState.lastDate = getTodayDateStr(); bingoState.todayMood = { start: null, end: null }; bingoState.todayIntent = createEmptyTodayIntent();
            document.getElementById('gridSizeBadge').innerText = `${bingoState.gridSize}x${bingoState.gridSize}`;
            saveBingo(); renderBingoGrid(); updateBingoProgress(); updateMoodUI(); updateTodayIntentUI();
        }
        function renderBingoGrid() {
            const n = bingoState.gridSize; const container = document.getElementById('gridContainer');
            container.style.gridTemplateColumns = `repeat(${n}, 1fr)`; container.innerHTML = '';
            const highlighted = new Set((bingoState.bingoLines || []).flat());
            bingoState.currentTasks.forEach((task, i) => {
                const item = document.createElement('div');
                item.className = `grid-item ${bingoState.currentStates[i] ? 'active' : ''} ${highlighted.has(i) ? 'bingo-line' : ''} ${i === bingoState.lastCompletedIndex ? 'just-completed' : ''}`;
                item.dataset.haptic = 'off';
                item.style.fontSize = n >= 5 ? '0.75rem' : '0.85rem'; item.innerText = task;
                item.onclick = (event) => { playPressAnimation(item, event); toggleBingoCell(i); };
                container.appendChild(item);
            });
            if (bingoState.lastCompletedIndex !== null) {
                setTimeout(() => { bingoState.lastCompletedIndex = null; }, 560);
            }
        }
        function getBingoLines() {
            const n = bingoState.gridSize; let lines = [];
            for (let r=0; r<n; r++) lines.push(Array.from({length:n}, (_,i)=>r*n+i));
            for (let c=0; c<n; c++) lines.push(Array.from({length:n}, (_,i)=>i*n+c));
            lines.push(Array.from({length:n}, (_,i)=>i*n+i), Array.from({length:n}, (_,i)=>i*n+(n-1-i)));
            return lines;
        }
        function getLineCounts() {
            return getBingoLines().map(line => line.filter(i => bingoState.currentStates[i]).length);
        }
        function toggleBingoCell(index) {
            const wasDone = bingoState.currentStates[index];
            const previousCounts = getLineCounts();
            bingoState.currentStates[index] = !wasDone;
            bingoState.lastCompletedIndex = bingoState.currentStates[index] ? index : null;
            HAPTIC.play(bingoState.currentStates[index] ? 24 : HAPTIC.tap);
            checkBingoWin(previousCounts, bingoState.currentStates[index]);
            renderBingoGrid();
        }
        function checkBingoWin(previousCounts = [], justCompleted = false) {
            const n = bingoState.gridSize, s = bingoState.currentStates;
            const lines = getBingoLines();
            const winningLines = lines.filter(line => line.every(i => s[i]));
            const isWin = winningLines.length > 0;
            bingoState.bingoLines = winningLines;
            if (justCompleted) {
                const nextCounts = lines.map(line => line.filter(i => s[i]).length);
                const formedThree = !isWin && nextCounts.some((count, i) => count === 3 && (previousCounts[i] || 0) < 3);
                const formedTwo = !isWin && nextCounts.some((count, i) => count === 2 && (previousCounts[i] || 0) < 2);
                if (formedThree || formedTwo) {
                    HAPTIC.play(HAPTIC.streak);
                    showToast(formedThree ? "三连！差一步就 Bingo" : "两连！节奏起来了");
                }
            }
            if (isWin && !bingoState.hasBingo) { bingoState.hasBingo = true; triggerConfetti(); showToast("BINGO! 整条线已点亮"); }
            if (!isWin) { bingoState.hasBingo = false; bingoState.bingoLines = []; }
            updateBingoHistory(); updateBingoProgress();
        }
        function updateBingoHistory() {
            const n = bingoState.gridSize; const completedCount = bingoState.currentStates.filter(Boolean).length;
            const percent = Math.floor((completedCount / (n * n)) * 100); const todayStr = getTodayDateStr();
            bingoState.history[todayStr] = { percent: bingoState.hasBingo ? 100 : percent, isBingo: bingoState.hasBingo, moodStart: bingoState.todayMood.start, moodEnd: bingoState.todayMood.end, intent: { ...bingoState.todayIntent, lightTasks: [...(bingoState.todayIntent.lightTasks || [])] } };
            saveBingo();
        }
        function updateBingoProgress() {
            const p = Math.floor((bingoState.currentStates.filter(Boolean).length / (bingoState.gridSize**2)) * 100);
            const ring = document.getElementById('progressRing'), text = document.getElementById('progressText'), stat = document.getElementById('progressStatusText');
            ring.style.strokeDashoffset = 263.89 - ((bingoState.hasBingo ? 100 : p) / 100) * 263.89; ring.setAttribute('stroke', bingoState.hasBingo ? cssVar('--gold') : cssVar('--primary'));
            text.innerText = `${bingoState.hasBingo ? 100 : p}%`; text.style.color = bingoState.hasBingo ? cssVar('--gold-text') : cssVar('--text-main');
            stat.innerText = bingoState.hasBingo ? "BINGO! 任务达成" : "打卡进行中"; stat.className = bingoState.hasBingo ? "text-base font-bold text-yellow-600" : "text-base font-bold text-gray-900";
        }
        function shuffleGrid() { HAPTIC.play(HAPTIC.reset); generateBingoGrid(); showToast("已重新生成"); }
        function resetBingoGrid() { HAPTIC.play(HAPTIC.reset); bingoState.currentStates.fill(false); bingoState.hasBingo = false; bingoState.bingoLines = []; bingoState.lastCompletedIndex = null; checkBingoWin(); renderBingoGrid(); showToast("状态已清空"); }
        function cycleMood(type) { HAPTIC.play(HAPTIC.tap); let idx = MOODS.findIndex(m => m.val === bingoState.todayMood[type]); bingoState.todayMood[type] = MOODS[(idx + 1) % MOODS.length].val; updateBingoHistory(); updateMoodUI(); }
        function updateMoodUI() { ['start', 'end'].forEach(type => { const mood = MOODS.find(m => m.val === bingoState.todayMood[type]) || MOODS[0]; const el = document.getElementById(type === 'start' ? 'moodStartIcon' : 'moodEndIcon'); el.innerHTML = mood.icon; el.className = `text-lg ${mood.color}`; }); }
        function updateTodayIntent(field, value) {
            if (!bingoState.todayIntent) bingoState.todayIntent = createEmptyTodayIntent();
            if (field.startsWith('lightTask')) {
                const index = Number(field.replace('lightTask', ''));
                bingoState.todayIntent.lightTasks[index] = value;
            } else {
                bingoState.todayIntent[field] = value;
            }
            updateBingoHistory();
        }
        function updateTodayIntentUI() {
            const intent = bingoState.todayIntent || createEmptyTodayIntent();
            document.getElementById('intentMainTask').value = intent.mainTask || '';
            for (let i = 0; i < 3; i++) document.getElementById(`intentLightTask${i}`).value = (intent.lightTasks || [])[i] || '';
            document.getElementById('intentDoneReason').value = intent.doneReason || '';
            document.getElementById('intentUndoneReason').value = intent.undoneReason || '';
            document.getElementById('intentMoodChange').value = intent.moodChange || '';
        }
        function triggerConfetti() {
            HAPTIC.play(HAPTIC.bingo);
            const grid = document.getElementById('gridContainer');
            grid.classList.remove('bingo-glow');
            void grid.offsetWidth;
            grid.classList.add('bingo-glow');
            setTimeout(() => grid.classList.remove('bingo-glow'), 1300);
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        function openBingoHistory() { HAPTIC.play(HAPTIC.tap); renderBingoCalendar(); document.getElementById('bingoHistoryModal').classList.add('show'); }
        function closeBingoHistory() { document.getElementById('bingoHistoryModal').classList.remove('show'); }
function renderBingoCalendar() {
            const now = new Date(); 
            const year = now.getFullYear(), month = now.getMonth(); 
            
            document.getElementById('calMonthDisplay').innerText = `${year}年 ${month + 1}月 打卡记录`;
            const firstDayOfMonth = new Date(year, month, 1).getDay(); 
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const calContainer = document.getElementById('calendarContainer'); 
            calContainer.innerHTML = '';
            
            // 【核心修复：数据清洗】
            // 提取库中所有记录的纯净日期（消除不可见字符和补零差异）
            const normalizedHistory = {};
            for (const key in bingoState.history) {
                // 用正则提取出连续的年份、月份、日期数字
                const match = key.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
                if (match) {
                    const y = parseInt(match[1]);
                    const m = parseInt(match[2]);
                    const d = parseInt(match[3]);
                    // 统一转成 "2026-5-15" 的标准格式作为查找字典
                    normalizedHistory[`${y}-${m}-${d}`] = bingoState.history[key];
                }
            }

            for (let i = 0; i < firstDayOfMonth; i++) { 
                const emptyCell = document.createElement('div'); emptyCell.className = 'cal-cell cal-empty'; calContainer.appendChild(emptyCell); 
            }
            
            let monthBingoCount = 0;
            for (let i = 1; i <= daysInMonth; i++) {
                // 生成当前格子的标准查找格式
                const currentCellKey = `${year}-${month + 1}-${i}`;
                
                // 去清洗后的字典里找数据，百发百中
                const record = normalizedHistory[currentCellKey];
                
                let cellClass = 'cal-cell cal-no-data'; let innerHtml = `${i}`;
                if (record) {
                    if (record.isBingo) { cellClass = 'cal-cell cal-bingo'; innerHtml = `${i}<i class="fas fa-star text-[8px] mt-0.5"></i>`; monthBingoCount++; }
                    else if (record.percent > 0 || record.moodStart || record.moodEnd) { cellClass = 'cal-cell cal-partial'; }
                    const getDotColor = (val) => (MOODS.find(m => m.val === val) || {}).dot || '';
                    if (record.moodStart) innerHtml += `<div class="mood-dot-start ${getDotColor(record.moodStart)}"></div>`;
                    if (record.moodEnd) innerHtml += `<div class="mood-dot-end ${getDotColor(record.moodEnd)}"></div>`;
                }
                
                // 安全判断"今天"，不再依赖字符串匹配，直接对比数字
                if (year === now.getFullYear() && month === now.getMonth() && i === now.getDate()) {
                    innerHtml += `<span class="cal-today-indicator"></span>`;
                }
                
                const cell = document.createElement('div'); 
                cell.className = cellClass; cell.innerHTML = innerHtml; calContainer.appendChild(cell);
            }
            
            document.getElementById('statTotalBingo').innerText = Object.values(bingoState.history).filter(r => r.isBingo).length;
            document.getElementById('statMonthBingo').innerText = monthBingoCount;
        }
        function openBingoSettings() { HAPTIC.play(HAPTIC.tap); tempGridSize = bingoState.gridSize; renderBingoSettingsPanel(); document.getElementById('bingoSettingsModal').classList.add('show'); }
        function closeBingoSettings() { document.getElementById('bingoSettingsModal').classList.remove('show'); }
        function renderBingoSettingsPanel() {
            const sizeSelector = document.getElementById('gridSizeSelector'); sizeSelector.innerHTML = '';
            [3, 4, 5, 6].forEach(size => {
                const btn = document.createElement('button'); btn.className = `flex-1 py-2 rounded-lg text-sm font-semibold transition btn-press ${size === tempGridSize ? 'bg-blue-500 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
                btn.innerText = `${size}x${size}`; btn.onclick = () => { tempGridSize = size; HAPTIC.play(HAPTIC.tap); renderBingoSettingsPanel(); }; sizeSelector.appendChild(btn);
            });
            document.getElementById('taskCount').innerText = `共 ${bingoState.taskLibrary.length} 项`;
            const list = document.getElementById('taskLibraryList'); list.innerHTML = '';
            bingoState.taskLibrary.forEach((task, index) => {
                const div = document.createElement('div'); div.className = 'flex justify-between items-center bg-white p-2 rounded border border-gray-100 shadow-sm';
                div.innerHTML = `<span class="text-sm text-gray-700 truncate mr-2">${task}</span><button onclick="removeBingoTask(${index})" class="text-gray-400 hover:text-red-500 p-1"><i class="fas fa-trash-alt text-xs"></i></button>`;
                list.appendChild(div);
            });
        }
        function addBingoTask() { const input = document.getElementById('newTaskInput'); const val = input.value.trim(); if (!val) return; if (bingoState.taskLibrary.includes(val)) return showToast("任务已存在"); bingoState.taskLibrary.unshift(val); input.value = ''; HAPTIC.play(HAPTIC.success); renderBingoSettingsPanel(); saveBingo(); }
        function removeBingoTask(i) { bingoState.taskLibrary.splice(i, 1); HAPTIC.play(HAPTIC.delete); renderBingoSettingsPanel(); saveBingo(); }
        function applyBingoSettings() { HAPTIC.play(HAPTIC.success); bingoState.gridSize = tempGridSize; generateBingoGrid(); closeBingoSettings(); showToast("设置已应用"); }


        // ==================== 纪律系统 (DISCIPLINE) 升级版(支持次数) ====================
        const DISC_KEY = 'discipline_system_data';
        
        const DEFAULT_DISC_TASKS = [
            { id: 't1', name: "进食比例", if: "开始吃正餐", then: "按 1/2蔬菜、1/4蛋白质、1/4碳水装盘", schedule: [0,1,2,3,4,5,6], target: 2 },
            { id: 't2', name: "液体规则", if: "口渴", then: "只喝水、茶或黑咖啡", schedule: [0,1,2,3,4,5,6], target: 1 },
            { id: 't3', name: "有氧心率", if: "做有氧运动", then: "保持 Zone 2 心率持续 >40 分钟", schedule: [1,3,5], target: 1 } 
        ];

        let discState = { tasks: DEFAULT_DISC_TASKS, logs: {}, notes: {} };
        let justCompletedDiscTaskId = null;

        function isTaskActiveOnDate(task, dateObj) {
            if (!task.schedule) return true; 
            const dayOfWeek = dateObj.getDay(); 
            return task.schedule.includes(dayOfWeek);
        }

        function initDiscipline() {
            const saved = localStorage.getItem(DISC_KEY);
            if (saved) discState = JSON.parse(saved);
            
            // 兼容迁移：旧数据补充 target 与 schedule
            discState.tasks.forEach(t => { 
                if(!t.schedule) t.schedule = [0,1,2,3,4,5,6]; 
                if(!t.target) t.target = 1;
            });

            document.getElementById('discDateDisplay').innerText = new Date().toDateString();
            document.getElementById('dailyNote').value = discState.notes[getTodayDateStr()] || '';
            
            renderDiscDashboard(); 
            renderHeatmap();
        }
        
        function saveDisc() { 
            localStorage.setItem(DISC_KEY, JSON.stringify(discState)); 
        }

        function renderDiscDashboard() {
            const container = document.getElementById('dashboardList');
            const todayStr = getTodayDateStr(); 
            const todayObj = new Date();
            const todayLogs = discState.logs[todayStr] || {};
            
            const activeTasks = discState.tasks.filter(t => isTaskActiveOnDate(t, todayObj));
            document.getElementById('discTodayLabel').innerText = `今日必做程序 (${activeTasks.length})`;

            if (activeTasks.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs font-mono">今日为系统调整日<br>无需执行任何核心纪律</div>`;
                return;
            }

            container.innerHTML = activeTasks.map(task => {
                const target = task.target || 1;
                let current = todayLogs[task.id];
                
                // 兼容历史的布尔值记录
                if (typeof current === 'boolean') current = current ? target : 0;
                if (typeof current !== 'number') current = 0;

                const isCompleted = current >= target;

                // 动态渲染状态图标
                let checkUI = '';
                if (target === 1) {
                    checkUI = isCompleted ? '<i class="fas fa-check text-xs"></i>' : '';
                } else {
                    checkUI = isCompleted ? '<i class="fas fa-check text-xs"></i>' : `<span class="text-[10px] font-bold text-slate-400">${current}/${target}</span>`;
                }

                return `
                <div class="task-card bg-white p-4 rounded-xl flex items-center justify-between" onclick="toggleDiscTask('${task.id}')">
                    <div class="flex-1 pr-3">
                        <h4 class="text-xs font-black text-slate-800 mb-1 tracking-wide">${task.name}</h4>
                        <div class="text-[10px] leading-snug">
                            <span class="text-slate-400 font-bold">IF:</span> <span class="text-slate-500">${task.if}</span><br>
                            <span class="text-blue-500 font-bold">THEN:</span> <span class="text-slate-700 font-medium">${task.then}</span>
                        </div>
                    </div>
                    <div class="checkbox-custom ${isCompleted ? 'checked' : ''} ${justCompletedDiscTaskId === task.id ? 'just-checked' : ''}">${checkUI}</div>
                </div>
                `;
            }).join('');
        }

        function toggleDiscTask(id) {
            const streakBefore = calculateCurrentStreak();
            const today = getTodayDateStr();
            if (!discState.logs[today]) discState.logs[today] = {};
            
            const task = discState.tasks.find(t => t.id === id);
            const target = task.target || 1;
            
            let current = discState.logs[today][id];
            // 兼容旧布尔值
            if (typeof current === 'boolean') current = current ? target : 0;
            if (typeof current !== 'number') current = 0;
            
            // 点击循环逻辑： 0 -> 1 -> ... -> target -> 0
            current = (current + 1) % (target + 1);
            
            discState.logs[today][id] = current;
            justCompletedDiscTaskId = current === target ? id : null;
            HAPTIC.play(current === target ? HAPTIC.complete : HAPTIC.tap);
            
            saveDisc(); 
            renderDiscDashboard(); 
            justCompletedDiscTaskId = null;
            const streakAfter = renderHeatmap();
            if (streakAfter > streakBefore && current === target) HAPTIC.play(HAPTIC.streak);
        }

        function updateNote() { 
            discState.notes[getTodayDateStr()] = document.getElementById('dailyNote').value; 
            saveDisc(); 
        }

        function calculateCurrentStreak() {
            let streak = 0; let streakBroken = false;
            for (let i = 83; i >= 0; i--) {
                const d = new Date(); d.setDate(new Date().getDate() - i);
                const key = d.toLocaleDateString('zh-CN', {timeZone: 'Asia/Shanghai'}).replace(/\//g, '-');
                const log = discState.logs[key] || {};
                const requiredTasks = discState.tasks.filter(t => isTaskActiveOnDate(t, d));
                const totalRequired = requiredTasks.length;
                let completedCount = 0;
                requiredTasks.forEach(t => {
                    let val = log[t.id];
                    let tTarget = t.target || 1;
                    if (typeof val === 'boolean') val = val ? tTarget : 0;
                    if (val >= tTarget) completedCount++;
                });
                const ratio = totalRequired > 0 ? completedCount / totalRequired : 1;
                if (ratio === 1 && !streakBroken) streak++;
                else if (i > 0) { streak = 0; if (ratio < 1) streakBroken = true; }
            }
            return streak;
        }

        function renderHeatmap() {
            const grid = document.getElementById('heatmapGrid'); grid.innerHTML = '';
            let streak = 0; let streakBroken = false;
            
            for (let i = 83; i >= 0; i--) { 
                const d = new Date(); d.setDate(new Date().getDate() - i);
                const key = d.toLocaleDateString('zh-CN', {timeZone: 'Asia/Shanghai'}).replace(/\//g, '-');
                const log = discState.logs[key] || {};
                
                const requiredTasks = discState.tasks.filter(t => isTaskActiveOnDate(t, d));
                const totalRequired = requiredTasks.length;
                
                let completedCount = 0;
                requiredTasks.forEach(t => { 
                    let val = log[t.id];
                    let tTarget = t.target || 1;
                    if (typeof val === 'boolean') val = val ? tTarget : 0;
                    if (val >= tTarget) completedCount++; 
                });

                let ratio = 1; 
                if (totalRequired > 0) ratio = completedCount / totalRequired;
                
                let level = '';
                if (totalRequired === 0) level = 'level-4'; 
                else if (ratio > 0 && ratio <= 0.3) level = 'level-1';
                else if (ratio > 0.3 && ratio <= 0.6) level = 'level-2';
                else if (ratio > 0.6 && ratio < 1) level = 'level-3';
                else if (ratio === 1) level = 'level-4';

                if (ratio === 1 && !streakBroken) streak++;
                else if (i > 0) { streak = 0; if (ratio < 1) streakBroken = true; }

                const cell = document.createElement('div'); 
                cell.className = `heatmap-cell ${level}`;
                cell.title = `${key}: ${completedCount}/${totalRequired} ${totalRequired === 0 ? '(休)' : ''}`;
                grid.appendChild(cell);
            }
            document.getElementById('streakCount').innerText = `${streak} Streaks`;
            grid.scrollLeft = grid.scrollWidth;
            return streak;
        }

        // --- 纪律设置 ---
        function openDiscSettings() { 
            HAPTIC.play(HAPTIC.tap);
            renderDiscSettings(); 
            document.getElementById('discSettingsModal').classList.add('show'); 
        }
        
        function closeDiscSettings() { 
            document.getElementById('discSettingsModal').classList.remove('show'); 
            renderDiscDashboard(); 
            renderHeatmap(); 
            showToast("系统纪律已更新");
        }
        
        function renderDiscSettings() {
            const list = document.getElementById('settingsTaskList');
            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

            list.innerHTML = discState.tasks.map((t, i) => {
                const sched = t.schedule || [0,1,2,3,4,5,6];
                const target = t.target || 1;
                
                const safeName = (t.name || '').replace(/"/g, '&quot;');
                const safeIf = (t.if || '').replace(/"/g, '&quot;');
                const safeThen = (t.then || '').replace(/"/g, '&quot;');

                const dayButtons = dayNames.map((dName, dIdx) => `
                    <button onclick="toggleDiscSchedule(${i}, ${dIdx})" class="w-6 h-6 rounded-full text-[10px] font-bold transition flex items-center justify-center ${sched.includes(dIdx) ? 'bg-blue-500 text-white shadow-sm' : 'bg-slate-100 text-slate-400'}">${dName}</button>
                `).join('');

                return `
                <div class="p-3 bg-white rounded-xl relative border border-slate-100 shadow-sm">
                    <input type="text" value="${safeName}" oninput="updateDiscTask(${i}, 'name', this.value)" class="w-[85%] bg-transparent border-none font-black text-xs p-0 mb-2 text-slate-800 focus:ring-0 focus:outline-none placeholder:text-slate-300" placeholder="程序名称...">
                    <div class="flex text-[10px] mt-1 items-center"><span class="text-slate-400 font-bold w-12">IF:</span><input type="text" value="${safeIf}" oninput="updateDiscTask(${i}, 'if', this.value)" class="flex-1 bg-transparent border-none p-0 text-slate-600 focus:ring-0 focus:outline-none placeholder:text-slate-300" placeholder="触发条件..."></div>
                    <div class="flex text-[10px] mt-1 items-center"><span class="text-blue-500 font-bold w-12">THEN:</span><input type="text" value="${safeThen}" oninput="updateDiscTask(${i}, 'then', this.value)" class="flex-1 bg-transparent border-none p-0 text-slate-600 focus:ring-0 focus:outline-none placeholder:text-slate-300" placeholder="客观动作..."></div>
                    <div class="flex text-[10px] mt-1 items-center">
                        <span class="text-slate-400 font-bold w-12">每日次数:</span>
                        <input type="number" min="1" max="20" value="${target}" oninput="updateDiscTask(${i}, 'target', parseInt(this.value) || 1)" class="w-16 bg-slate-50 border border-slate-200 rounded px-2 py-1 text-center focus:outline-none focus:ring-1 focus:ring-blue-400 text-slate-600">
                    </div>
                    
                    <div class="mt-3 pt-3 border-t border-slate-50 flex justify-between items-center">
                        <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Schedule</span>
                        <div class="flex space-x-1">${dayButtons}</div>
                    </div>

                    <button onclick="removeDiscTask(${i})" class="absolute top-3 right-3 text-slate-300 hover:text-red-400 transition"><i class="fas fa-trash text-sm"></i></button>
                </div>
                `;
            }).join('');
        }

        function toggleDiscSchedule(taskIdx, dayIdx) {
            HAPTIC.play(HAPTIC.tap);
            let sched = discState.tasks[taskIdx].schedule || [0,1,2,3,4,5,6];
            if (sched.includes(dayIdx)) {
                sched = sched.filter(d => d !== dayIdx);
            } else {
                sched.push(dayIdx);
            }
            discState.tasks[taskIdx].schedule = sched;
            saveDisc();
            renderDiscSettings(); 
        }

        function updateDiscTask(idx, field, val) { 
            discState.tasks[idx][field] = val; 
            saveDisc(); 
        }
        
        function addNewTaskTemplate() { 
            discState.tasks.push({ id: 't'+Date.now()+Math.floor(Math.random()*100), name: "新纪律程序", if: "", then: "", schedule: [0,1,2,3,4,5,6], target: 1 }); 
            HAPTIC.play(HAPTIC.success);
            saveDisc(); 
            renderDiscSettings(); 
            const list = document.getElementById('settingsTaskList');
            setTimeout(() => { list.parentElement.scrollTop = list.parentElement.scrollHeight; }, 50);
        }
        
        function removeDiscTask(idx) { 
            discState.tasks.splice(idx, 1); 
            HAPTIC.play(HAPTIC.delete);
            saveDisc(); 
            renderDiscSettings(); 
        }

        // ==================== 启动 ====================
        window.addEventListener('DOMContentLoaded', () => {
            applyThemeMode();
            setupButtonHaptics();
            initBingo();
            initDiscipline();
            document.getElementById('newTaskInput').addEventListener('keypress', e => e.key === 'Enter' && addBingoTask());
        });
    </script>
</body>
</html>
